<!DOCTYPE html>
<html>

<head>
  <meta name="renderer" content="webkit">
    <meta name="description" content="使用 Vue、Vuex 制作的俄罗斯方块" />
    <meta name="keywords" content="俄罗斯方块,Tetris,Vue,Vuex,JavaScript">
    <meta name="format-detection" content="telephone=no"/>
    <script>;(function(){var w=parseInt(window.screen.width),s=w/640,u=navigator.userAgent.toLowerCase(),m='<meta name="viewport" content="width=640,';if(/android (\d+\.\d+)/.test(u)){if(parseFloat(RegExp.$1)>2.3)m+='minimum-scale='+s+',maximum-scale='+s+',';}else{m+='user-scalable=no,';}m+='target-densitydpi=device-dpi">';document.write(m);}());</script>
    <meta charset="UTF-8">
  <title>俄罗斯方块</title>
  <link rel="stylesheet" href="static/loader.css">
  <style>
    .gp-home-btn, .gp-lb-btn { position: fixed; z-index: 50;
      font-size: 18px; text-decoration: none; opacity: 0.35; transition: opacity 0.15s; }
    .gp-home-btn:active, .gp-lb-btn:active { opacity: 0.7; }
    .gp-home-btn { top: 12px; right: 12px; }
    .gp-lb-btn { top: 12px; right: 44px; }
  </style>
</head>

<body>

  <div id="root">
    <div class="load">
      <div class="loader">加载中...</div>
    </div>
  </div>
  <a href="https://game-list-arv.pages.dev" class="gp-home-btn" title="主页">🏠</a>
  <a href="https://game-list-arv.pages.dev?tab=leaderboard&game=tetris" class="gp-lb-btn" title="天梯榜">🏆</a>
  <!-- 社交平台 SDK（同步加载，确保 GamePlatform 在游戏逻辑前就绪）-->
  <script>
    window.__GP_API_BASE__ = new URLSearchParams(location.search).get('api') || 'https://api.w1lkin.site';
    document.write('<script src="' + window.__GP_API_BASE__ + '/sdk.js"><\/script>');
  </script>
  <script>
    window.GamePlatform.init();
    // 硬登录门：未登录跳转门户页登录
    window.GamePlatform.mountGate({ gameId: 'tetris' }).then(function () {
      window._gpReady = true;
    }).catch(function () {
      window._gpReady = true;
    });
  </script>
  <!-- built files will be auto injected -->
</body>

</html>
